services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: payload
      POSTGRES_PASSWORD: "as1GcF08Tn6AkcmvKMLe1NIx-QL68DwR"
    volumes:
      - payload_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "gdL19PBebVVWtNtJfqiWQ4Xg3pRyOMO8"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: payload_test
      POSTGRES_PASSWORD: "ytx5igDyiPsnHZeRKGEKWp7xpq-bWoEN"
    volumes:
      - payload_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "MzNr-NS9HaJwXIJd12m2ofGF2gKztEVL"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  payload_data:
  payload_test_data:
