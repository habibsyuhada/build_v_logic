name: Build APK

on:
  workflow_dispatch: {}

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # app/ depends on `flutter: sdk: flutter` (workspace member), so the
      # whole workspace is resolved via flutter, same as ci.yml.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: flutter pub get (workspace)
        run: flutter pub get

      # Release build type falls back to the debug signing config
      # (app/android/app/build.gradle.kts — no custom release signing set
      # up yet), so this produces an installable, unsigned-for-release
      # APK suitable for sideloading/testing, not for a store submission.
      - name: flutter build apk (release)
        working-directory: app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: payload-app-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
