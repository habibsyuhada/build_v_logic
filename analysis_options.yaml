# Workspace-wide analyzer config (applies to every package under packages/,
# tools/, server/, app/ via directory-tree lookup). No external `lints`
# package dependency on purpose, so `dart analyze` never depends on network
# resolution beyond the workspace's own pub get.
analyzer:
  language:
    strict-casts: true
    strict-inference: true
  errors:
    todo: ignore

linter:
  rules:
    - always_declare_return_types
    - avoid_empty_else
    - avoid_print
    - avoid_returning_null_for_void
    - avoid_types_as_parameter_names
    - camel_case_types
    - cancel_subscriptions
    - constant_identifier_names
    - control_flow_in_finally
    - empty_catches
    - empty_statements
    - no_duplicate_case_values
    - non_constant_identifier_names
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - throw_in_finally
    - unnecessary_statements
    - unrelated_type_equality_checks
    - valid_regexps
