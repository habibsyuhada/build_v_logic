version: "3.9"

# Local dev infrastructure for the Serverpod backend (§2.2, §4.4). The
# `server` service is a stub until Phase 4 adds the real Serverpod project;
# `postgres` and `redis` are usable standalone from Phase 0 onward for
# `tools/` scripts and future integration tests.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload_dev
      POSTGRES_DB: payload
    ports:
      - "5432:5432"
    volumes:
      - payload_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  payload_postgres_data:
